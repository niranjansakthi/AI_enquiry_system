<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Curd Rice Business Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2220%22>🍚</text></svg>">
</head>

<body>
  <div class="app-container">
    <!-- LEFT DARK TEAL SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          🍚
        </div>
        <div class="logo-title">
          Curd Rice<br>Business Studio
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Dashboard
        </a>
        <a href="/enquiries"
          class="nav-item {% if request.url.path.startswith('/enquiries') and request.url.path != '/enquiries/new' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Enquiries
        </a>
        <a href="/upload-csv" class="nav-item {% if request.url.path == '/upload-csv' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Upload CSV
        </a>
        <a href="/analytics" class="nav-item {% if request.url.path == '/analytics' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          Analytics
        </a>
        <a href="/review" class="nav-item {% if request.url.path == '/review' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          Review Queue
        </a>
        <a href="/about" class="nav-item {% if request.url.path == '/about' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          About
        </a>
      </nav>

      <div class="sidebar-footer">
        <strong>Smarter Enquiries.</strong>
        Stronger Business.
      </div>
    </aside>

    <!-- RIGHT MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP STATUS BAR -->
      <div class="top-bar">
        <div class="system-status">
          <span class="status-dot"></span>
          System Online
        </div>
        <div class="user-avatar-badge" title="Curd Rice Studio Admin">
          CR
        </div>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>
</body>

</html>
