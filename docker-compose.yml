services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curd_rice_enquiry_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/enquiries.db}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_TIMEOUT=${GROQ_TIMEOUT:-30}
      - GROQ_MAX_RETRIES=${GROQ_MAX_RETRIES:-2}
      - DUPLICATE_DETECTION_WINDOW_DAYS=${DUPLICATE_DETECTION_WINDOW_DAYS:-7}
      - DUPLICATE_SIMILARITY_THRESHOLD=${DUPLICATE_SIMILARITY_THRESHOLD:-0.85}
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
    driver: local
